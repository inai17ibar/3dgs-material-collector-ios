name: MaterialCollector
options:
  bundleIdPrefix: com.inai17ibar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CaptureKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.CaptureKit
        GENERATE_INFOPLIST_FILE: true
  MaterialCollector:
    type: application
    platform: iOS
    sources:
      - path: Sources/MaterialCollector
    dependencies:
      - target: CaptureKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 3DGS Material Collector
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: 3DGS 用の写真・動画を撮影し、ARKit でカメラの位置を追跡するためにカメラを使用します。
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.MaterialCollector
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
