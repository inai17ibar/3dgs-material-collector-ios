name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: CaptureKit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift build
      - run: swift test

  app-ios:
    name: App build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project MaterialCollector.xcodeproj -scheme MaterialCollector -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
